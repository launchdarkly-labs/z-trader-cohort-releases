# yaml-language-server: $schema=https://demodepot.launchdarklydemos.com/schemas/demo.schema.json
schemaVersion: 1
slug: z-trader-cohort-releases
name: "Z-Trader: cohort releases, guarded"
summary: Core Code Control demo. Release to one audience at a time on a mobile base; the cohort that regresses rolls itself back.
owners:
  - ahiremath@launchdarkly.com
tags: [feature-management, guarded-rollouts, progressive-rollouts, targeting, segments, mobile, observability, experimentation]
media:
  cover: ./media/cover.png
links: {}
parameters:
  - name: BUGGY_REGION
    label: City that hits the fault
    type: enum
    options: [delhi, jaipur, goa]
    default: jaipur
  - name: BUGGY_COHORT
    label: OS version that hits the fault
    type: enum
    options: [ios18, ios17, ios16]
    default: ios17
  - name: FAILURE_RATE
    label: Render-error rate in the affected group when dark mode is on
    type: string
    default: "0.50"
  - name: SESSIONS_PER_MINUTE
    label: Sessions per minute, per population
    type: string
    default: "1200"
  - name: FIX_APPLIED
    label: Clear the fault (the fix-forward beat)
    type: enum
    options: ["false", "true"]
    default: "false"
  - name: DEMO_MODE
    label: Which populations to run
    type: enum
    options: [both, one, optiona]
    default: both
runtime:
  ingress:
    container: web
    port: 8765
    healthCheck: { path: /healthz }
  containers:
    # The demo page: trader phone and fleet wall on one screen.
    - name: web
      build: { context: ./app }
      cpu: 512
      memory: 1024
      env: { NODE_ENV: production, DEMO_PORT: "8765" }
      # A guarded rollout needs a metric to watch, and nothing else can create one:
      # the seed importer does not do metrics, and the injected LD_API_TOKEN's inline
      # role covers proj, env, flag, segment and aiconfig but NOT metric. So the owner
      # sets one LaunchDarkly token here once, in the portal at /owners/<slug>, and
      # every launch uses it to create the metrics and the release policy. SEs launching
      # the demo do nothing.
      secrets: [LD_SETUP_TOKEN]
    # Traffic. Guarded rollouts and experiments need events flowing or every
    # chart is empty, so this is a sidecar rather than something the SE starts.
    # Same image as web; only the command differs.
    - name: traffic
      build: { context: ./app }
      command: ["node", "simulator.js"]
      cpu: 512
      memory: 1024
      env: { NODE_ENV: production }
      dependsOn: [web]
capabilities: []
launchdarkly:
  seed: ./ld/seed.json
  # project-writer is needed: app/ld-bootstrap.js creates the five metrics and
  # six rule-based segments that the seed importer cannot, and a guarded rollout
  # is impossible without the metrics.
  apiToken: project-writer
access:
  default: sso
  allowPublic: false
lifecycle:
  pausable: true
verify:
  http:
    - path: /healthz
      expectStatus: 200
    - path: /
      expectStatus: 200
      expectBodyContains: Z-Trader
