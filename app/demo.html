<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Z-Trader — cohort release demo</title>
<style>
  :root{
    --page:#0b0e14; --panel:#131824; --line:#232a38; --ink:#e7eaf0; --dim:#8b94a6;
    --brand:#5b8cff; --up:#3ddc84; --down:#ff6b73; --chip:#1b2130;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .bar{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line)}
  .brand{font-weight:700;font-size:22px;letter-spacing:-.4px}.brand span{color:var(--brand)}
  .sub{font-size:12px;color:var(--dim)}
  .spacer{flex:1}
  .switch{display:flex;gap:6px}
  .switch button{background:var(--chip);color:var(--dim);border:1px solid var(--line);padding:6px 12px;
    border-radius:8px;font:600 12px inherit;cursor:pointer}
  .switch button.sel{background:var(--brand);border-color:var(--brand);color:#fff}
  .layout{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:14px 16px;align-items:start}
  @media (min-width:1400px){.layout{grid-template-columns:360px 1fr;gap:20px;padding:18px 20px}}
  @media (max-width:820px){.layout{grid-template-columns:1fr}}

  /* ---------- trader app (left) ---------- */
  .appcol h2,.wallcol h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin:0 0 10px 2px}
  .phone{border:8px solid #2b3240;border-radius:30px;overflow:hidden;background:#fff;
    box-shadow:0 14px 40px rgba(0,0,0,.45)}
  .scr{height:min(560px,58vh);overflow:auto;transition:background .35s,color .35s}
  @media (min-width:1400px){.scr{height:min(620px,64vh)}}
  .scr[data-theme="light"]{background:#f5f6f8;color:#12161f;--s:#fff;--l:#e3e6ec;--m:#5f6878;--g:#0a7d43;--r:#c62828;--b:#1d4ed8;--c:#eef1f6}
  .scr[data-theme="dark"]{background:#0b0e14;color:#e7eaf0;--s:#131824;--l:#232a38;--m:#8b94a6;--g:#3ddc84;--r:#ff6b73;--b:#5b8cff;--c:#1b2130}
  .nav{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;background:var(--s);border-bottom:1px solid var(--l)}
  .nav .t{font-weight:700;font-size:15px}
  .nav .t i{color:var(--b);font-style:normal}
  .pill{margin-left:auto;font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--c);color:var(--m)}
  .pill.on{background:var(--b);color:#fff}
  .body{padding:11px}
  .card{background:var(--s);border:1px solid var(--l);border-radius:11px;padding:11px;margin-bottom:9px}
  .lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--m)}
  .big{font-size:23px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
  .delta{font-size:13px;font-weight:600;color:var(--g)}
  .hrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--l)}
  .hrow:last-child{border-bottom:0}
  .tkr{font-weight:700;font-size:13px}.nm{font-size:11px;color:var(--m)}
  .num{text-align:right;font-size:13px}
  .pos{color:var(--g);font-weight:600}.neg{color:var(--r);font-weight:600}
  .cta{width:100%;background:var(--b);color:#fff;border:0;border-radius:10px;padding:11px;font:600 14px inherit;cursor:pointer}
  .sheet{border-color:var(--b)}
  .sheet h4{margin:0 0 8px;font-size:13px}
  .sheet .kv{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--m)}
  .sheet .kv b{color:inherit;font-weight:600}
  .btnrow{display:flex;gap:8px;margin-top:10px}
  .btnrow button{flex:1;border-radius:9px;padding:9px;font:600 13px inherit;cursor:pointer;border:1px solid var(--l)}
  .btnrow .go{background:var(--b);color:#fff;border-color:var(--b)}
  .btnrow .back{background:transparent;color:var(--m)}
  .placed{font-size:12px;color:var(--g);font-weight:600}
  .flowchip{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;background:var(--c);
    color:var(--m);font:600 9px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase}
  .crash{border-color:var(--r)}
  .crash h3{margin:0 0 5px;color:var(--r);font-size:14px}
  .crash p{margin:0;font-size:12px;color:var(--m)}
  .mono{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--m);word-break:break-word}
  .picker{display:flex;gap:6px;margin-bottom:10px}
  .picker button{flex:1;background:var(--chip);color:var(--dim);border:1px solid var(--line);border-radius:8px;
    padding:7px 4px;font:600 11px inherit;cursor:pointer}
  .picker button.sel{background:#fff;color:#12161f;border-color:#fff}
  .picker.shape button{font:600 10px ui-monospace,SFMono-Regular,Menlo,monospace}
  .picker.shape button.sel{background:var(--brand);color:#fff;border-color:var(--brand)}
  .diag{margin-top:8px;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);line-height:1.6}

  /* ---------- fleet wall (right) ---------- */
  .fam{margin-bottom:12px}
  .famhead{font-size:12px;font-weight:600;color:#c3cbd9;margin:0 0 9px 2px}
  .famhead code{color:#8fa3c8;font-size:11px}
  .wallrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media (min-width:1400px){.wallrow{gap:14px}}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px}
  .chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .cname{font-weight:700;font-size:17px;letter-spacing:-.2px}
  .statline{display:flex;align-items:baseline;gap:7px;margin-top:3px}
  .statnum{font-size:23px;font-weight:700;letter-spacing:-.6px;color:#eef2f8;line-height:1.1}
  .statlbl{font-size:11px;color:#8b94a6}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
  .badge.dark{background:var(--brand);color:#fff}
  .badge.light{background:#2a3242;color:#c2ccdb}
  .badge.err{background:#b4232b;color:#fff}
  .flagchip{display:inline-block;margin-top:6px;padding:3px 8px;border-radius:5px;background:#232b3b;
    border:1px solid #33405a;color:#c3d3f0;white-space:nowrap;
    font:600 10px ui-monospace,SFMono-Regular,Menlo,monospace}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
  @media (min-width:1400px){.grid{grid-template-columns:repeat(6,1fr);gap:6px}}
  .tile{aspect-ratio:9/17;border-radius:7px;border:2px solid #2b3240;background:#f7f8fa;overflow:hidden;
    position:relative;transition:background .4s,border-color .4s}
  .tile .n{height:9%;display:flex;align-items:center;justify-content:center}
  .tile .n i{display:block;width:34%;height:2px;border-radius:2px;background:#c8ccd4}
  .tile .sp{height:22%;margin:4px 12% 0;border-radius:3px;background:linear-gradient(180deg,#cfe0ff,#eaf1ff)}
  .tile .bd{padding:0 12%}
  .tile .ln{height:4px;border-radius:2px;background:#d4d8e0;margin-bottom:4px}
  .tile.on{background:#0e1117;border-color:var(--brand)}
  .tile.on .n i{background:#2a3140}.tile.on .ln{background:#242c3a}
  .tile.on .sp{background:linear-gradient(180deg,#16233d,#0e1117)}
  .tile.err{background:#2a0e11;border-color:#b4232b}
  .tile.err .ln,.tile.err .sp{background:#4a1a1e}
  .tile.err::after{content:"!";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font:700 15px inherit;color:#ff6b73}
</style></head>
<body>
<div class="bar">
  <div class="brand">Z-<span>Trader</span></div>
  <div class="spacer"></div>
  <div class="switch">
    <button id="m-both" onclick="setMode('both')">Compare both</button>
    <button id="m-one" class="sel" onclick="setMode('one')">One flag</button>
    <button id="m-split" onclick="setMode('split')">A flag per OS</button>
  </div>
</div>

<div class="layout">
  <div class="appcol">
    <h2>What the trader sees <span id="apphead" style="color:#a9bce0;font-weight:500;text-transform:none;letter-spacing:0"></span></h2>
    <div class="picker" id="picker"></div>
    <div class="phone"><div class="scr" id="scr" data-theme="light">
      <div class="nav"><div class="t">Z-<i>Trader</i></div><span class="pill" id="pill">light</span></div>
      <div class="body" id="appbody"></div>
    </div></div>
    <div class="diag" id="diag"></div>
  </div>

  <div class="wallcol">
    <h2>Across the fleet — who has dark mode right now</h2>
    <div id="wall"></div>
  </div>
</div>

<script type="application/json" id="cfg">__CFG__</script>
<script type="module">
import * as LDClient from 'https://esm.sh/launchdarkly-js-client-sdk@3.9.5';
import Observability, { LDObserve } from 'https://esm.sh/@launchdarkly/observability@1.1.23';
import SessionReplay from 'https://esm.sh/@launchdarkly/session-replay@1.1.23';

const CFG = JSON.parse(document.getElementById('cfg').textContent);
// The app's identity depends on which flag shape is on show: a trader in a city
// for the city-sequenced flag, an iOS device for the per-OS flags.
const GROUPS = {
  one: {
    delhi:  { label: 'Delhi',  city: 'Delhi',  os: '18.2',    model: 'iPhone 16 Pro' },
    jaipur: { label: 'Jaipur', city: 'Jaipur', os: '17.5',    model: 'iPhone 14' },
    goa:    { label: 'Goa',    city: 'Goa',    os: '16.7.10', model: 'iPhone SE' },
  },
  optiona: {
    ios18: { label: 'iOS 18.2', os: '18.2',    model: 'iPhone 16 Pro' },
    ios17: { label: 'iOS 17.5', os: '17.5',    model: 'iPhone 14' },
    ios16: { label: 'iOS 16.7', os: '16.7.10', model: 'iPhone SE' },
  },
};
const DEFAULT_GROUP = { one: 'jaipur', optiona: 'ios17' };

/* ================= trader app ================= */
const OPTION_A_FLAG = { ios18: 'dark-mode-ios18', ios17: 'dark-mode-ios17', ios16: 'dark-mode-ios16' };
let cohort = null;                       // current group key within the active family
const groups = () => GROUPS[shape];
const grp = () => groups()[cohort];
// Which flag shape the app asks. 'one' is the recommended single flag; 'optiona'
// makes the app ask its own OS version's flag, which is the cost a flag per OS imposes on
// application code — the app now has to know which flag to look up.
// Driven by the header filter (setMode) so the app and the wall always agree.
// In 'both' mode the app reads the single flag, which is the recommended shape.
let shape = 'one';
const flagKey = () => (shape === 'optiona' ? OPTION_A_FLAG[cohort] : 'dark-mode');
const famId = () => (shape === 'optiona' ? 'split' : 'one');
const currentValue = () => client.variation(flagKey(), false);

// The phone adopts one of the server's candidate devices for this cohort, using
// the same keys so its own evaluation matches what the server reported.
let appIdx = 0;
function contextFor(c, i) {
  const g = groups()[c];
  const user = { key: famId() + '-app-usr-' + c + '-' + i, plan_tier: 'pro' };
  if (shape === 'one') user.region = g.city;
  return {
    kind: 'multi',
    user,
    device: {
      key: famId() + '-app-dev-' + c + '-' + i,
      operating_system: 'iOS',
      os_version: g.os,
      model: g.model,
      app_version: '5.13.0',
    },
  };
}
const deviceKey = () => famId() + '-app-dev-' + cohort + '-' + appIdx;

function renderPicker() {
  document.getElementById('picker').innerHTML = Object.entries(groups())
    .map(([k, g]) => '<button data-c="' + k + '" onclick="pick(\'' + k + '\')">' + g.label + '</button>')
    .join('');
}
const HOLDINGS = [
  { t: 'RELIANCE',  n: 'Reliance Industries',  q: 180, p: 1420.30, d:  1.24 },
  { t: 'TCS',       n: 'Tata Consultancy Svcs', q:  40, p: 4152.80, d:  0.61 },
  { t: 'HDFCBANK',  n: 'HDFC Bank',            q: 130, p: 1689.45, d: -2.08 },
  { t: 'INFY',      n: 'Infosys',              q:  95, p: 1876.20, d:  0.42 },
  { t: 'NIFTYBEES', n: 'Nippon Nifty 50 ETF',  q: 650, p:  282.15, d:  0.33 },
];
// Indian grouping (lakh/crore), e.g. 40,79,861.00
const money = (v) => '\u20b9' + v.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function attrs(dark, extra) {
  const c = grp();
  return Object.assign({
    'app.cohort': cohort, 'app.os_version': c.os, 'app.device_model': c.model,
    'app.region': c.city || '',
    'app.app_version': '5.13.0', 'app.screen': 'portfolio',
    'feature.flag_key': flagKey(), 'feature.dark_mode': dark,
    'feature.demo_shape': shape,
  }, extra || {});
}

// The fault this demo is about: on the affected OS cohort the dark palette
// fails to load, and building the holdings table throws for real.
function buildHoldings(dark) {
  const buggyKey = shape === 'optiona' ? CFG.buggyCohort : CFG.buggyRegion;
  if (dark && cohort === buggyKey) {
    const palette = null;
    return HOLDINGS.map((h) => '<div class="hrow">' + palette.rowClass + '</div>').join('');
  }
  const asRupees = pnlMode() === 'rupees';
  return HOLDINGS.map((h, i) => {
    const cls = h.d >= 0 ? 'pos' : 'neg', sign = h.d >= 0 ? '+' : '';
    const value = h.q * h.p;
    const change = asRupees
      ? sign + money(Math.abs(value * h.d / 100))
      : sign + h.d.toFixed(2) + '%';
    return '<div class="hrow" data-holding="' + i + '"><div><div class="tkr">' + h.t + '</div>'
      + '<div class="nm">' + h.n + '</div></div>'
      + '<div class="num"><div>' + money(value) + '</div>'
      + '<div class="' + cls + '">' + change + '</div></div></div>';
  }).join('');
}

const ORDER = { t: 'RELIANCE', q: 25, p: 1420.30 };
// The order-confirm-flow experiment concluded on two-step, so the confirm sheet
// is now the product behaviour rather than a flag lookup.
const flow = () => 'two-step';
const pnlMode = () => client.variation('pnl-display', 'percent');

function orderAttrs(dark) {
  return attrs(dark, {
    'order.symbol': ORDER.t, 'order.qty': ORDER.q,
    'order.value': ORDER.q * ORDER.p, 'order.flow': flow(),
  });
}
// Renders the order card for whichever confirmation flow the experiment serves.
function orderCard(dark, state) {
  const oneTap = flow() === 'one-tap';
  const chip = '<span class="flowchip">' + flow() + '</span>';
  if (state === 'placed') {
    return '<div class="card"><div class="placed">Order placed · ' + ORDER.q + ' ' + ORDER.t + '</div>'
      + '<div class="btnrow"><button class="back" id="cancelOrder">Cancel order</button></div></div>';
  }
  if (state === 'cancelled') {
    return '<div class="card"><div class="lbl">Order cancelled</div>'
      + '<div class="btnrow"><button class="go" id="order">Place market order' + chip + '</button></div></div>';
  }
  if (state === 'confirm') {
    return '<div class="card sheet"><h4>Confirm your order</h4>'
      + '<div class="kv"><span>Instrument</span><b>' + ORDER.t + '</b></div>'
      + '<div class="kv"><span>Quantity</span><b>' + ORDER.q + '</b></div>'
      + '<div class="kv"><span>Order value</span><b>' + money(ORDER.q * ORDER.p) + '</b></div>'
      + '<div class="btnrow"><button class="back" id="backOrder">Back</button>'
      + '<button class="go" id="confirmOrder">Confirm order</button></div></div>';
  }
  return '<div class="card"><button class="cta" id="order">'
    + (oneTap ? 'Place market order' : 'Review order') + chip + '</button></div>';
}

function wireOrder(dark, state) {
  const oneTap = flow() === 'one-tap';
  const place = () => {
    client.track('order-placed');
    LDObserve.recordLog('order placed · flow=' + flow(), 'info', orderAttrs(dark));
    setOrderState(dark, 'placed');
  };
  const btn = document.getElementById('order');
  if (btn) btn.onclick = () => (oneTap ? place() : setOrderState(dark, 'confirm'));
  const confirm = document.getElementById('confirmOrder');
  if (confirm) confirm.onclick = place;
  const back = document.getElementById('backOrder');
  if (back) back.onclick = () => setOrderState(dark, 'idle');
  const cancel = document.getElementById('cancelOrder');
  if (cancel) cancel.onclick = () => {
    // The mis-trade signal: the guardrail metric for removing a confirmation step.
    client.track('order-cancelled');
    LDObserve.recordLog('order cancelled after placement · flow=' + flow(), 'warn', orderAttrs(dark));
    setOrderState(dark, 'cancelled');
  };
}

let orderState = 'idle';
function setOrderState(dark, state) {
  orderState = state;
  const slot = document.getElementById('orderslot');
  if (!slot) return;
  slot.innerHTML = orderCard(dark, state);
  wireOrder(dark, state);
}

function renderApp(dark) {
  document.getElementById('scr').dataset.theme = dark ? 'dark' : 'light';
  const pill = document.getElementById('pill');
  pill.textContent = dark ? 'dark' : 'light';
  pill.className = 'pill' + (dark ? ' on' : '');
  for (const b of document.querySelectorAll('#picker button[data-c]'))
    b.className = b.dataset.c === cohort ? 'sel' : '';

  document.getElementById('apphead').textContent = '· asking LaunchDarkly for ' + flagKey();
  const body = document.getElementById('appbody');
  const total = HOLDINGS.reduce((a, h) => a + h.q * h.p, 0);

  LDObserve.startSpan('render.portfolio', () => {
    try {
      const rows = buildHoldings(dark);
      body.innerHTML =
        '<div class="card"><div class="lbl">Account value</div><div class="big">' + money(total) + '</div>'
        + '<div class="delta">+' + money(total * 0.0042) + ' today</div></div>'
        + '<div class="card"><div class="lbl" style="margin-bottom:4px">Holdings</div>' + rows + '</div>'
        + '<div id="orderslot"></div>';
      orderState = 'idle';
      setOrderState(dark, 'idle');
      for (const row of document.querySelectorAll('.hrow[data-holding]')) {
        row.style.cursor = 'pointer';
        row.onclick = () => {
          client.track('holding-tapped');
          LDObserve.recordLog('holding opened · pnl=' + pnlMode(), 'info', attrs(dark));
          row.style.opacity = '0.55';
        };
      }
      LDObserve.recordLog('portfolio rendered: cohort=' + cohort + ' dark_mode=' + dark, 'info', attrs(dark));
      diag(dark ? 'Dark mode on · screen loaded normally' : 'Dark mode off · screen loaded normally');
    } catch (err) {
      LDObserve.recordError(err, 'Portfolio screen failed to render', attrs(dark, { 'app.render_failed': true }));
      LDObserve.recordLog('render failed: cohort=' + cohort + ' dark_mode=' + dark + ' — ' + err.message,
        'error', attrs(dark, { 'app.render_failed': true }));
      body.innerHTML =
        '<div class="card crash"><h3>Unable to load your portfolio</h3>'
        + '<p>Something went wrong rendering this screen. Our team has been notified.</p>'
        + '<p class="mono" style="margin-top:8px">' + err.name + ': ' + err.message + '</p></div>';
      diag('Dark mode on · SCREEN FAILED TO LOAD — ' + err.name + ': ' + err.message);
    }
  });
}
function diag(msg) {
  const c = grp();
  const who = c.city ? c.city + ' · ' + c.model : c.model + ' · iOS ' + c.os;
  document.getElementById('diag').textContent =
    who + inRollout + '\n' + msg;
}

let inRollout = '';
let identifyChain = Promise.resolve();
// Queue identifies so the last requested context is the one that sticks.
function setContext() {
  identifyChain = identifyChain
    .then(() => client.identify(contextFor(cohort, appIdx)))
    .then(() => renderApp(currentValue()))
    .catch(() => {});
  return identifyChain;
}
shape = (localStorage.getItem('wallmode') === 'split') ? 'optiona' : 'one';
cohort = localStorage.getItem('group-' + shape) || DEFAULT_GROUP[shape];
if (!groups()[cohort]) cohort = DEFAULT_GROUP[shape];
renderPicker();
const client = LDClient.initialize(CFG.clientSideId, contextFor(cohort, appIdx), {
  plugins: [new Observability({ serviceName: 'brokerage-trader-web' }), new SessionReplay({ privacySetting: 'none' })],
});
client.on('ready', () => renderApp(currentValue()));
// Generic change: the app may be watching any of the four flags depending on shape.
client.on('change', () => renderApp(currentValue()));

window.pick = (c) => {
  cohort = c; localStorage.setItem('group-' + shape, c);
  appIdx = 0; inRollout = '';
  return setContext();
};


/* ================= fleet wall ================= */
let mode = localStorage.getItem('wallmode') || 'one', latest = [];
window.setMode = (m) => {
  mode = m; localStorage.setItem('wallmode', m);
  for (const id of ['both', 'one', 'split'])
    document.getElementById('m-' + id).className = (id === m) ? 'sel' : '';
  // Keep the phone on the same flag family as the wall, and swap its grouping:
  // cities for the city-sequenced flag, OS versions for the per-OS flags.
  const next = (m === 'split') ? 'optiona' : 'one';
  if (next !== shape) {
    shape = next;
    cohort = localStorage.getItem('group-' + shape) || DEFAULT_GROUP[shape];
    if (!groups()[cohort]) cohort = DEFAULT_GROUP[shape];
    appIdx = 0; inRollout = '';
    renderPicker();
    if (typeof client !== 'undefined' && client.identify) setContext();
  }
  renderWall(latest);
};

function section(fam) {
  const cols = fam.groups.map((g) => {
    const n = g.tiles;
    const dark = Math.round(g.darkShare * n), errs = Math.round(g.errorShare * n);
    const pct = Math.round(100 * g.darkShare);
    const badge = errs ? '<span class="badge err">' + errs + ' screens failing</span>'
                : dark >= n ? '<span class="badge dark">fully rolled out</span>'
                : dark ? '<span class="badge dark">' + pct + '% rolled out</span>'
                : '<span class="badge light">not yet rolled out</span>';
    let tiles = '';
    for (let i = 0; i < n; i++) {
      const on = i < dark, er = on && i < errs;
      tiles += '<div class="tile ' + (er ? 'err' : (on ? 'on' : '')) + '">'
        + '<div class="n"><i></i></div><div class="sp"></div>'
        + '<div class="bd"><div class="ln"></div><div class="ln"></div><div class="ln"></div></div></div>';
    }
    return '<div class="col"><div class="chead"><span class="cname">' + g.label + '</span>' + badge + '</div>'
      + '<div class="statline"><span class="statnum">' + pct + '%</span>'
      + '<span class="statlbl">on dark mode</span></div>'
      + '<div class="flagchip">' + g.flagKey + '</div>'
      + '<div class="grid">' + tiles + '</div></div>';
  }).join('');
  return '<div class="fam"><div class="famhead">' + fam.title + '</div><div class="wallrow">' + cols + '</div></div>';
}
function renderWall(items) {
  latest = items;
  if (!items || !items.length) return;
  document.getElementById('wall').innerHTML =
    items.filter((f) => mode === 'both' || mode === f.family).map(section).join('');
}

// As the rollout ramps, hop the phone onto a candidate identity that is actually
// in it, so the screen on show is genuinely affected rather than a bystander the
// percentage happened to miss.
async function followRollout(items) {
  const fam = items.find((x) => x.family === famId());
  const mine = fam && fam.groups.find((g) => g.key === cohort);
  if (!mine || !mine.appDark) return;
  const dark = mine.appDark;
  const amDark = dark.includes(appIdx);
  let want = appIdx;
  if (!amDark && dark.length) want = dark[0];
  else if (amDark && !dark.length) want = 0;
  const prevLabel = inRollout;
  inRollout = dark.length && dark.includes(want)
    ? '  ·  included in this rollout (' + dark.length + ' of ' + mine.appPool + ' devices)' : '';
  if (want === appIdx) {
    // Same identity, but the rollout label may have gone stale (e.g. a rollback).
    if (prevLabel !== inRollout) renderApp(currentValue());
    return;
  }
  appIdx = want;
  await setContext();
}

new EventSource('/events').onmessage = (e) => {
  const items = JSON.parse(e.data);
  renderWall(items);
  followRollout(items);
};
setMode(mode);
</script>
